<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JuegosyMas1372</title>
<style>
body{font-family:Arial;background:#0f0f0f;color:white;text-align:center;padding:20px}
button{padding:12px 20px;margin:8px;border:none;border-radius:10px;background:#ff0000;color:white;font-weight:bold;cursor:pointer;width:280px}
button.done{background:#00c853}
button:disabled{background:#555}
#final{display:none;margin-top:20px;padding:20px;background:#1e1e1e;border-radius:15px}
code{background:#000;padding:10px;display:block;margin:10px 0;border-radius:8px;word-break:break-all}
</style>
</head>
<body>
<h1>JuegosyMas1372</h1>
<p>Completa las tareas para desbloquear el script</p>

<div id="tareas">
<button id="b1" onclick="iniciar(1,30)">1. Suscribirse al canal (30s)</button><br>
<button id="b2" onclick="iniciar(2,30)">2. Activar campanita (30s)</button><br>
<button id="b3" onclick="iniciar(3,50)">3. Comentar un video (50s)</button><br>
<button id="b4" onclick="iniciar(4,90)">4. Dar like (90s)</button><br>
<p id="contador">Verificar completado (0/4)</p>
<button onclick="verificar()" style="background:white;color:black;width:280px">Verificar</button>
</div>

<div id="final">
<h2>¡Tareas completadas!</h2>
<code id="scriptText">loadstring(game:HttpGet("https://raw.githubusercontent.com/flazhy/QuantumOnyx/refs/heads/main/QuantumOnyx.lua"))()</code>
<button onclick="copiar()">Copiar al portapapeles</button><br>
<button onclick="irYoutube()" style="background:#ff0000">Ir a mi canal</button>
</div>

<script>
let tareas=[false,false,false,false];
function iniciar(n,segundos){
let btn=document.getElementById('b'+n);
if(btn.disabled) return;
btn.disabled=true;
window.open('https://youtube.com/@juegosymas1372?si=7aJhIIqNOctmCcmM','_blank');
let tiempo=segundos;
btn.innerText=`Esperando ${tiempo}s...`;
let intervalo=setInterval(()=>{
tiempo--;
btn.innerText=`Esperando ${tiempo}s...`;
if(tiempo<=0){
clearInterval(intervalo);
tareas[n-1]=true;
btn.classList.add('done');
btn.innerText='✓ Completado';
btn.disabled=false;
actualizar();
}
},1000);
}
function actualizar(){
let c=tareas.filter(x=>x).length;
document.getElementById('contador').innerText=`Verificar completado (${c}/4)`;
}
function verificar(){
if(tareas.filter(x=>x).length==4){
document.getElementById('tareas').style.display='none';
document.getElementById('final').style.display='block';
}else{alert('Te faltan tareas, espera a que terminen los tiempos');}
}
function copiar(){navigator.clipboard.writeText(document.getElementById('scriptText').innerText);alert('¡Script copiado!');}
function irYoutube(){window.location.href='https://youtube.com/@juegosymas1372?si=7aJhIIqNOctmCcmM';}
</script>
</body>
</html>
