<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Onyx - Key System</title>
<style>
body{font-family:Arial;background:#0f0f0f;color:white;text-align:center;padding:20px}
h1{color:#a020f0}
input{padding:14px;width:90%;max-width:350px;border-radius:12px;border:none;text-align:center;font-size:16px;margin:10px}
button{padding:14px 22px;margin:10px;border:none;border-radius:12px;background:#a020f0;color:white;font-weight:bold;cursor:pointer;width:90%;max-width:350px;font-size:16px}
button.done{background:#00c853 !important}
button:disabled{background:#555 !important}
#final, #steps{display:none;margin-top:25px;padding:20px;background:#1e1e1e;border-radius:15px;border:2px solid #a020f0}
code{background:#000;padding:12px;display:block;margin:15px 0;border-radius:8px;word-break:break-all;font-size:13px;color:#0f0;text-align:left}
#keyBox{background:#1e1e1e;padding:20px;border-radius:15px;margin-bottom:20px}
</style>
</head>
<body>
<h1>💜 QUANTUM ONYX 💜</h1>
<div id="keyBox">
<h3>🔑 Ingresa tu Key</h3>
<input type="text" id="keyInput" placeholder="Pega tu key aquí">
<br>
<button onclick="checkKey()">DESBLOQUEAR</button>
<p style="font-size:12px;color:#888;">¿No tienes key? Completa los pasos abajo</p>
</div>
<div id="steps">
<p>Completa los 3 pasos para obtener tu key: <b>acceso123</b></p>
<button id="b1" onclick="go(this, 'https://www.youtube.com/@JuegosyMas1372?sub_confirmation=1', 30)">1. SUSCRIBIRSE (30s)</button>
<button id="b2" onclick="go(this, 'https://www.youtube.com/@JuegosyMas1372', 50)">2. CAMPANITA 🔔 (50s)</button>
<button id="b3" onclick="go(this, 'https://youtu.be/2pXeR89YYto?si=4D0u3GcgRDIqIKV2', 90)">3. LIKE 👍 (90s)</button>
</div>
<div id="final">
<h2>✅ ¡Key Correcta!</h2>
<p>Copia tu Script:</p>
<code id="codigo">loadstring(game:HttpGet("https://raw.githubusercontent.com/flazhy/QuantumOnyx/refs/heads/main/QuantumOnyx.lua"))()</code>
<button onclick="navigator.clipboard.writeText(document.getElementById('codigo').innerText);alert('¡Copiado!');">📋 COPIAR SCRIPT</button>
</div>
<script>
document.getElementById('steps').style.display='block';
function checkKey(){
 let k = document.getElementById('keyInput').value.trim();
 if(k === "acceso123"){
   document.getElementById('final').style.display='block';
   document.getElementById('steps').style.display='none';
   document.getElementById('keyBox').style.display='none';
   window.scrollTo(0,document.body.scrollHeight);
 } else {
   alert('❌ Key incorrecta, la key es: acceso123');
 }
}
let done=0;
function go(btn, url, segundos){
 window.open(url, '_blank');
 let t=segundos;
 btn.disabled=true;
 let inter=setInterval(()=>{
   btn.innerText='Esperando '+t+'s...';
   t--;
   if(t<0){
     clearInterval(inter);
     btn.innerText='✅ COMPLETADO - Key: acceso123';
     btn.classList.add('done');
     done++;
     if(done===3){
       alert('¡Ya completaste! Tu key es: acceso123 - Ponla arriba');
       document.getElementById('keyInput').value='acceso123';
     }
   }
 },350);
}
</script>
</body>
</html>
